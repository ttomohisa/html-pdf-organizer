name: Deploy offline app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build fully embedded HTML
        shell: pwsh
        run: ./build-offline.ps1

      - name: Verify deployment artifact
        shell: pwsh
        run: |
          $html = Get-Content -Raw -Encoding UTF8 dist/index.html
          if ($html -match '<script[^>]+src\s*=\s*["'']https?://' -or $html -match 'import\s+.+?from\s+["'']https?://') {
            throw "External runtime dependency remains in dist/index.html"
          }
          if ($html -match '__PDF_[A-Z_]+__') {
            throw "Build placeholder remains in dist/index.html"
          }
          if (-not (Test-Path dist/.nojekyll)) {
            throw "dist/.nojekyll was not generated"
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
