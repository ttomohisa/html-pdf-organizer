name: Build offline HTML

on:
  pull_request:
  push:
    paths:
      - "src/**"
      - "versions.json"
      - "build-offline.ps1"
      - "build-offline.bat"
      - ".github/workflows/build-offline.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build standalone HTML
        shell: powershell
        run: .\build-offline.ps1
      - name: Verify source and generated release
        run: node --test
      - name: Verify mobile label in Chromium
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          node --test tests/local-processing-label.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Local label regression failed." }
          $testTools = Join-Path $env:RUNNER_TEMP "mobile-label-tests"
          npm install --prefix $testTools --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed." }
          $env:NODE_PATH = Join-Path $testTools "node_modules"
          & (Join-Path $testTools "node_modules/.bin/playwright.cmd") install chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed." }
          New-Item -ItemType Directory -Force -Path test-results/mobile-label | Out-Null
          node scripts/mobile-label.browser.cjs 2>&1 | Tee-Object -FilePath test-results/mobile-label/results.log
          if ($LASTEXITCODE -ne 0) { throw "Mobile label browser regression failed." }
      - name: Upload mobile label browser evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-label-browser-evidence
          path: test-results/mobile-label/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pdf-organizer-offline
          path: dist/
