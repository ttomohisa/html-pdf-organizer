name: Build offline HTML

on:
  pull_request:
  push:
    paths:
      - "src/**"
      - "versions.json"
      - "build-offline.ps1"
      - "build-offline.bat"
      - ".github/workflows/build-offline.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone HTML
        shell: powershell
        run: .\build-offline.ps1
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pdf-organizer-offline
          path: dist/
